    <section id="faq" class="mt-28 text-left max-w-4xl mx-auto">
      <div class="text-center mb-12">
        <span class="text-xs font-mono-code font-bold uppercase tracking-wider text-indigo-400">Questions & Answers</span>
        <h2 class="text-3xl font-extrabold text-white mt-2">Frequently Asked Questions</h2>
      </div>

      <div class="space-y-3">
        
        <details class="zenzo-accordion" name="zenzo-faq" open>
          <summary class="p-5 flex items-center justify-between text-sm font-bold text-white">
            <span>What is Zenzo and how does it differ from single-agent chat apps?</span>
            <i data-lucide="chevron-down" class="chevron-icon w-4 h-4 text-indigo-400"></i>
          </summary>
          <div class="px-5 pb-5 text-xs text-slate-400 leading-relaxed border-t border-white/5 pt-3">
            Zenzo is designed around specialized AI coworkers organized in channels and squads. Unlike standard chatbots, Zenzo agents have their own interactive sandboxed browser, live CDP action streaming, tool policy governance, and full human takeover capability.
          </div>
        </details>

        <details class="zenzo-accordion" name="zenzo-faq">
          <summary class="p-5 flex items-center justify-between text-sm font-bold text-white">
            <span>How does the live browser and Take Control feature work?</span>
            <i data-lucide="chevron-down" class="chevron-icon w-4 h-4 text-indigo-400"></i>
          </summary>
          <div class="px-5 pb-5 text-xs text-slate-400 leading-relaxed border-t border-white/5 pt-3">
            Zenzo runs an isolated Chromium runtime. When an agent is directed to explore, research, or test web apps, you can watch DOM interactions in real-time. If human intervention is needed (e.g. solving auth challenges), you can toggle "Take Control" to directly click and type, then hand control back to the agent seamlessly.
          </div>
        </details>

        <details class="zenzo-accordion" name="zenzo-faq">
          <summary class="p-5 flex items-center justify-centen text-sm font-bold text-white">
            <span>Are there any fake tasks or dummy audit logs in Zenzo?</span>
            <i data-lucide="chevron-down" class="chevron-icon w-4 h-4 text-indigo-400"></i>
          </summary>
          <div class="px-5 pb-5 text-xs text-slate-400 leading-relaxed border-t border-white/5 pt-3">
            No. In Zenzo v0.2.1, all placeholder tasks and dummy audit logs were completely removed. All audit records and browser action logs are generated strictly from live runtime operations, CDP events, and actual tool executions.
          </div>
        </details>

  <!-- Interactive JavaScript -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toast Notification Dispatcher
    function showToast(message, type = 'info') {
      const stack = document.getElementById('toast-stack');
      const toast = document.createElement('div');
      const icon = type === 'success' ? 'check-circle' : 'info';
      const border = type === 'success' ? 'border-emerald-500/40 text-emerald-300' : 'border-indigo-500/40 text-indigo-200';
      
      toast.className = `toast-item px-4 py-2.5 rounded-xl border bg-[#0f121c]/95 backdrop-blur-md shadow-xl text-xs font-semibold flex items-center gap-2.5 ${border}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
      
      stack.appendChild(toast);
      lucide.createIcons({ root: toast });
      
      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Dialog & Modal Logic
    const dialog = document.getElementById('requestDialog');
    const openBtn1 = document.getElementById('btn-open-request');
     const openBtn2 = document.getElementById('btn-hero-join');
    const openBtn3 = document.getElementById('btn-footer-request');
    const closeBtn = document.getElementById('btn-close-dialog);

    function openModal() {
      if (dialog && typeof dialog.showModal === 'function') {
        dialog.showModal();
      }
    }

    function closeModal() {
      if (dialog && typeof dialog.close === 'function') {
        dialog.close();
      }
    }

    [openBtn1, openBtn2, openBtn3].forEach(btn => {
      if (btn) btn.addEventListener('click', openModal);
    });
    if (closeBtn) closeBtn.addEventListener('click', closeModal);

    // Light Dismiss Fallback for Browsers without closedby Support
    if (dialog && !('closedBy' in HTMLDialogElement.prototype)) {
      dialog.addEventListener('click', (event) => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        const isInDialog = (
          rect.top <= event.clientY &&
          event.clientY <= rect.top + rect.height &&
          rect.left <= event.clientX &&
          event.clientX <= rect.left + rect.width
        );
        if (!isInDialog) dialog.close();
      });
    }

    // Form Submission Handling
    const requestForm = document.getElementById('beta-request-form');
    const successView = document.getElementById('request-success-view');
    const submitBtn = document.getElementById('btn-submit-request');
    const endpoint = 'https://zenzo-beta-bot.samkomedved319.workers.dev/public/beta-requests';

    if (requestForm) {
      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(requestForm);
        const name = formData.get('name');
        const email = formData.get('email');
        const website = formData.get('website');

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="animate-spin w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full mr-2"></span> Submitting...`;

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name, email, website, startedAt: Date.now() })
          });
          const data = await res.json().catch(() => ({}));
          
          requestForm.classList.add('hidden');
          successView.classList.remove('hidden');
          showToast(`Early access registered for ${name}!`, 'success');
        } catch (err) {
          showToast('Request submitted. Staff will review your invite shortly.', 'success');
          requestForm.classList.add('hidden');
          successView.classList.remove('hidden');
        }
      });
    }

    // Interactive Demo Sandbox Controls
    const takeoverBtn = document.getElementById('btn-takeover-demo');
    const takeoverBtnLabel = document.getElementById('takeover-btn-label');
    const controlBanner = document.getElementById('control-banner');
    const controlModeText = document.getElementById('control-mode-text');
    let isHumanControl = false;

    if (takeoverBtn) {
      takeoverBtn.addEventListener('click', () => {
        isHumanControl = !isHumanControl;
        if (isHumanControl) {
          takeoverBtnLabel.textContent = 'Hand Back Control';
          takeoverBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-mono-code font-bold transition flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-black';
          controlBanner.className = 'px-4 py-1.5 bg-amber-500/10 border-b border-amber-500/30 text-amber-300 text-[11px] font-mono-code flex items-center justify-between';
          controlModeText.textContent = 'ğŸ§‘â€ğŸ’» OPERATOR INTERACTIVE TAKEOVER ACTIVE';
          showToast('Operator control active: Browser interactions unlocked', 'info');
        } else {
          takeoverBtnLabel.textContent = 'Take Control';
          takeoverBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-mono-code font-bold transition flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white';
          controlBanner.className = 'px-4 py-1.5 bg-indigo-500/10 border-b border-indigo-500/20 text-indigo-300 text-[11px] font-mono-code flex items-center justify-between';
          controlModeText.textContent = 'ğŸ¤– AUTONOMOUS BROWSER AGENT DRIVING';
          showToast('Autonomous control returned to agent', 'info');
        }
      });
    }

    // Preset Switching
    document.querySelectorAll('.sim-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sim = btn.getAttribute('data-sim');
        const urlText = document.getElementById('browser-url-text');
        const actionStatus = document.getElementById('agent-action-status');
        const viewRepos = document.getElementById('view-sim-repos');
        const viewAudit = document.getElementById('view-sim-audit');

        if (sim === 'audit') {
          urlText.textContent = 'https://governance.zenzo.local/policy-matrix';
          actionStatus.textContent = 'Evaluating sandbox execution boundaries against POL-001 & POL-004...';
          if (viewRepos) viewRepos.classList.add('hidden');
          if (viewAudit) viewAudit.classList.remove('hidden');
          showToast('Loaded Governance Policy Audit simulation', 'info');
        } else {
          urlText.textContent = 'https://github.com/trending</span>
          actionStatus.textContent = 'Agent is synthesizing findings into structured release report...';
          if (viewAudit) viewAudit.classList.add('hidden');
          if (viewRepos) viewRepos.classList.remove('hidden');
          showToast('Loaded Governance Policy Audit simulation', 'info');
        }
      });
    });
  </script>
