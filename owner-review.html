<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#060816" />
  <title>Zenzo Beta — Owner review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#f5f7ff; --muted:#99a3b9; --line:rgba(205,214,255,.15); --canvas:#060816; --mint:#75e7c1; } *{box-sizing:border-box} body{min-width:320px;min-height:100vh;margin:0;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 20% 0%,rgba(45,212,191,.24),transparent 38%),radial-gradient(circle at 85% 80%,rgba(124,114,255,.28),transparent 40%),var(--canvas);font-family:Manrope,ui-sans-serif,system-ui,sans-serif}.grid{position:fixed;inset:0;opacity:.35;background-image:linear-gradient(rgba(158,171,218,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(158,171,218,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 100%)}main{position:relative;width:min(600px,calc(100% - 40px));padding:42px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(25,30,53,.88),rgba(7,10,23,.9));box-shadow:0 35px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);text-align:center}.lock{display:grid;place-items:center;width:58px;height:58px;margin:auto;border:1px solid rgba(117,231,193,.22);border-radius:18px;color:#b6f4de;background:rgba(117,231,193,.1);font-size:24px}small{display:block;margin-top:22px;color:#aeeaff;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em}h1{margin:12px 0 0;font-size:37px;letter-spacing:-.06em}p{max-width:435px;margin:16px auto 0;color:var(--muted);font-size:14px;line-height:1.75}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:27px;padding:13px 18px;border-radius:13px;color:#061018;background:linear-gradient(135deg,#91eef0,#c9c5ff);box-shadow:0 15px 35px rgba(117,231,193,.16);font-size:12px;font-weight:800;text-decoration:none;transition:transform .18s}.button:hover{transform:translateY(-2px)}.back{display:inline-block;margin-top:18px;color:#a8b5d1;font-size:11px;text-decoration:none}.back:hover{text-decoration:underline}@media(max-width:520px){main{width:min(100% - 28px,600px);padding:32px 21px;border-radius:24px}h1{font-size:31px}}
  </style>
</head>
<body><div class="grid"></div><main><div class="lock">⌁</div><small>ZENZO PRIVATE BETA</small><h1>Owner review queue</h1><p>Beta applications are stored in the restricted Zenzo review sheet. Sign in with the account that owns the sheet to view requests and set each decision to <strong>Pending</strong>, <strong>Approved</strong>, or <strong>Declined</strong>.</p><a class="button" href="https://docs.google.com/spreadsheets/d/1pQ7Q5_ouVcERt3oPSv0FN8I_rUJFrT4pKv9Wcj4y1W0/edit?gid=446706134#gid=446706134" target="_blank" rel="noreferrer">Open private review queue ↗</a><br /><a class="back" href="./index.html">Return to Zenzo</a></main></body>
</html>
